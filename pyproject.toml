[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "partstrack"
dynamic = ["version"]
description = "A small inventory for electronic parts, backed by SQLite"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/kaythe/partstrack"
Changelog = "https://github.com/kaythe/partstrack/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = ["flask>=3.0", "waitress>=3.0"]
desktop = ["PySide6-Essentials>=6.8"]

[project.scripts]
partstrack = "partstrack.cli:main"
partstrack-web = "partstrack.web.app:main"

[project.gui-scripts]
partstrack-desktop = "partstrack.desktop.app:main"

[tool.setuptools.packages.find]
include = ["partstrack*"]

[tool.setuptools.package-data]
"partstrack.web" = ["templates/*.html", "static/*"]

[tool.setuptools.dynamic]
version = {attr = "partstrack.__version__"}
