{% extends "base.html" %}
{% block title %}About{% endblock %}
{% block content %}
<h1>About partstrack</h1>
<p>A small inventory for electronic parts, backed by SQLite.</p>
<dl class="details">
  <dt>Version</dt>

{% endblock %}
