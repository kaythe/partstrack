name: Release

# Pushing a tag such as v1.2.0 runs all tests, builds the sdist and wheel and
# publishes them as a GitHub release, with that version's CHANGELOG.md section
# as the release notes.

on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import partstrack; print(partstrack.__version__)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match partstrack.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Build the sdist and wheel
        run: pip install build && python -m build

      - name: Check the wheel's contents
        run: |
          unzip -l dist/*.whl | grep -q templates/about.html
          unzip -l dist/*.whl | grep -q partstrack/desktop/app.py
          unzip -l dist/*.whl | grep -q partstrack/logo.svg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$VERSION" in
            *a[0-9]* | *b[0-9]* | *rc[0-9]* | *dev*) prerelease=--prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "partstrack $VERSION" \
            --notes-file notes.md \
            --verify-tag $prerelease
