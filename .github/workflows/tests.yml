name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with the web extra
        run: pip install '.[web]'
      - name: Run all tests
        run: python -m unittest -v

  cli-only:
    # The CLI must work without any dependencies, so also test without Flask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run tests (web tests are skipped)
        run: python -m unittest -v

  package:
    # Check that the package builds and contains the web templates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install build && python -m build
      - run: unzip -l dist/*.whl | grep -q templates/about.html
